<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Mid Autumn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Adapts cleanly to mobile URL bars */
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .player-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Minimalist central play badge */
    .play-trigger {
      position: absolute;
      width: 72px;
      height: 72px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, opacity 0.2s ease;
      pointer-events: none;
      z-index: 10;
    }

    .play-trigger svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
      margin-left: 4px; /* Optically centers the play triangle */
    }

    .play-trigger.hidden {
      opacity: 0;
      transform: scale(0.8);
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="player-container" id="tapArea">
    <video id="mainVideo" playsinline preload="auto">
      <source src="L%26C%20Mid%20Autumn(1-Compr).mp4?v=1" type="video/mp4">
      <source src="L&C Mid Autumn(1-Compr).mp4?v=1" type="video/mp4">
    </video>

    <!-- Sleek tap-to-play icon -->
    <div class="play-trigger" id="playIcon">
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>
  </div>

  <script>
    const container = document.getElementById('tapArea');
    const video = document.getElementById('mainVideo');
    const playIcon = document.getElementById('playIcon');

    // Tap anywhere to toggle play/pause with full audio
    container.addEventListener('click', () => {
      if (video.paused) {
        video.play().then(() => {
          playIcon.classList.add('hidden');
        }).catch(() => {});
      } else {
        video.pause();
        playIcon.classList.remove('hidden');
      }
    });

    // Re-show play badge if the video finishes
    video.addEventListener('ended', () => {
      playIcon.classList.remove('hidden');
    });
  </script>
</body>
</html>
