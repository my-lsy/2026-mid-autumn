<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mid Autumn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Large clickable play overlay */
    #playOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      cursor: pointer;
      z-index: 20;
    }

    .play-circle {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .play-circle svg {
      width: 32px;
      height: 32px;
      fill: #fff;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <video id="myVideo" playsinline preload="auto" controls>
      <source src="L%26C%20Mid%20Autumn(1-Compr).mp4?v=2" type="video/mp4">
      <source src="L&C Mid Autumn(1-Compr).mp4?v=2" type="video/mp4">
    </video>

    <div id="playOverlay">
      <div class="play-circle">
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('myVideo');
    const overlay = document.getElementById('playOverlay');

    function startPlayback(e) {
      if (e) e.preventDefault();
      
      video.muted = false;
      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          overlay.style.display = 'none';
        }).catch((err) => {
          // If iOS blocks unmuted sound on first touch, play muted first then unmute
          video.muted = true;
          video.play().then(() => {
            video.muted = false;
            overlay.style.display = 'none';
          }).catch(() => {
            // If still blocked, remove overlay so native video controls take over directly
            overlay.style.display = 'none';
          });
        });
      }
    }

    // Bind both touch and click to prevent mobile browser tap drops
    overlay.addEventListener('touchstart', startPlayback, { passive: false });
    overlay.addEventListener('click', startPlayback);

    video.addEventListener('ended', () => {
      overlay.style.display = 'flex';
    });
  </script>
</body>
</html>
