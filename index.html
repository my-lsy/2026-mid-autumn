<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mid Autumn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Cover Layer: Guarantees cover.jpg displays instantly before tap */
    #coverLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      background: #000;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .play-circle {
      position: absolute;
      width: 80px;
      height: 80px;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .play-circle svg {
      width: 32px;
      height: 32px;
      fill: #fff;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <video id="myVideo" playsinline controls preload="metadata">
      <source src="L%26C%20Mid%20Autumn(1-Compr).mp4?v=3" type="video/mp4">
      <source src="L&C Mid Autumn(1-Compr).mp4?v=3" type="video/mp4">
    </video>

    <!-- Visual cover overlay -->
    <div id="coverLayer">
      <img src="cover.jpg?v=1" alt="Cover" class="cover-img">
      <div class="play-circle">
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('myVideo');
    const cover = document.getElementById('coverLayer');

    function startPlayback(e) {
      if (e) e.preventDefault();

      video.muted = false;
      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          cover.style.display = 'none';
        }).catch(() => {
          // If browser policy blocks sound on initial trigger, start muted then unmute
          video.muted = true;
          video.play().then(() => {
            video.muted = false;
            cover.style.display = 'none';
          }).catch(() => {
            cover.style.display = 'none';
          });
        });
      }
    }

    cover.addEventListener('touchstart', startPlayback, { passive: false });
    cover.addEventListener('click', startPlayback);

    video.addEventListener('ended', () => {
      cover.style.display = 'flex';
    });
  </script>
</body>
</html>
